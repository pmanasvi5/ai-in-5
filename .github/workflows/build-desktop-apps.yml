name: Build desktop apps

# Builds real, native, downloadable installers for macOS (.dmg) and Windows
# (.exe) and, on a version tag, publishes them to a GitHub Release — a
# stable public download link, at zero cost (public-repo Pages/Actions are
# free, and these installers are intentionally unsigned rather than paying
# for an Apple Developer / code-signing certificate).
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_script: electron:build:mac
          - os: windows-latest
            build_script: electron:build:win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run ${{ matrix.build_script }} -- --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact (for manual/non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-in-5-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: warn
